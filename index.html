<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>董竹君 · 我的一个世纪</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #0e0a06;
  --paper: #f5efe6;
  --red: #9b2335;
  --gold: #c8963e;
  --muted: #7a6a58;
  --cream: #ede4d4;
}

html, body {
  width: 100%; height: 100%;
  background: var(--ink);
  color: var(--paper);
  font-family: 'Noto Serif SC', serif;
  overflow: hidden;
  position: fixed;
}

/* ── Canvas ── */
#canvas {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* ── App shell ── */
#app {
  position: relative;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 1;
  max-width: 500px;
  margin: 0 auto;
}

/* ── Header ── */
header {
  text-align: center;
  padding: 20px 16px 6px;
  flex-shrink: 0;
}
header h1 {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(1.8rem, 6vw, 2.6rem);
  color: var(--gold);
  letter-spacing: .2em;
  text-shadow: 0 0 40px rgba(200,150,62,.5), 0 2px 0 rgba(0,0,0,.5);
}
header .subtitle {
  font-size: .7rem;
  color: var(--muted);
  letter-spacing: .25em;
  margin-top: 3px;
}
.divider {
  width: 120px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 8px auto 0;
  opacity: .5;
}

/* ── Stage ── */
#stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  min-height: 0;
}

/* Silhouette */
#silhouette-wrap {
  position: relative;
  width: clamp(120px, 36vw, 170px);
  height: clamp(190px, 57vw, 270px);
  cursor: pointer;
  flex-shrink: 0;
}
#silhouette-wrap svg {
  width: 100%; height: 100%;
  filter: drop-shadow(0 0 20px rgba(155,35,53,.4)) drop-shadow(0 0 60px rgba(200,150,62,.2));
  transition: filter .5s;
}
#silhouette-wrap:hover svg,
#silhouette-wrap.active svg {
  filter: drop-shadow(0 0 30px rgba(155,35,53,.7)) drop-shadow(0 0 80px rgba(200,150,62,.4));
}

/* Aura rings */
.aura {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(200,150,62,.15);
  animation: aura-pulse 4s ease-in-out infinite;
  pointer-events: none;
}
.aura:nth-child(1) { inset: -20px; animation-delay: 0s; }
.aura:nth-child(2) { inset: -38px; animation-delay: .8s; border-color: rgba(155,35,53,.1); }
.aura:nth-child(3) { inset: -56px; animation-delay: 1.6s; }
@keyframes aura-pulse {
  0%,100% { opacity:.3; transform:scale(1); }
  50% { opacity:.8; transform:scale(1.04); }
}

/* Era badge */
.era {
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: .6rem;
  color: var(--muted);
  letter-spacing: .15em;
  white-space: nowrap;
}

/* ── Chat panel ── */
#chat-panel {
  width: 100%;
  height: 52%;
  display: flex;
  flex-direction: column;
  padding: 0 14px 14px;
  flex-shrink: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(14,10,6,.97) 15%);
}

#messages {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 2px 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(200,150,62,.15) transparent;
}

.msg {
  max-width: 85%;
  line-height: 1.7;
  font-size: clamp(.75rem, 2.5vw, .85rem);
  animation: rise .4s ease forwards;
  opacity: 0;
}
@keyframes rise {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}

.msg.her {
  align-self: flex-start;
  background: rgba(155,35,53,.08);
  border: 1px solid rgba(155,35,53,.2);
  border-left: 2px solid var(--red);
  border-radius: 0 12px 12px 0;
  padding: 10px 14px 10px 12px;
  color: #ede4d4;
  position: relative;
}
.msg.her .label {
  font-size: .55rem;
  color: var(--red);
  letter-spacing: .1em;
  margin-bottom: 4px;
  opacity: .8;
}

.msg.me {
  align-self: flex-end;
  background: rgba(245,239,230,.05);
  border: 1px solid rgba(245,239,230,.1);
  border-right: 2px solid rgba(200,150,62,.4);
  border-radius: 12px 0 0 12px;
  padding: 10px 12px 10px 14px;
  color: #b0a898;
  font-size: clamp(.72rem, 2.3vw, .82rem);
}

/* Typing */
.typing { display: flex; gap: 4px; padding: 12px 14px; }
.typing span {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--red); opacity: .6;
  animation: blink 1.1s infinite;
}
.typing span:nth-child(2) { animation-delay: .18s; }
.typing span:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%,80%,100%{transform:scale(.6);opacity:.3} 40%{transform:scale(1);opacity:1} }

/* ── Hint chips ── */
#hints {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}
.chip {
  background: rgba(155,35,53,.08);
  border: 1px solid rgba(155,35,53,.25);
  border-radius: 20px;
  padding: 4px 11px;
  font-size: clamp(.62rem, 2vw, .7rem);
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
  font-family: 'Noto Serif SC', serif;
}
.chip:hover { color: var(--paper); border-color: var(--red); background: rgba(155,35,53,.18); }

/* ── Input ── */
#input-bar {
  display: flex;
  gap: 8px;
}
#user-input {
  flex: 1;
  background: rgba(245,239,230,.04);
  border: 1px solid rgba(200,150,62,.2);
  border-bottom: 1px solid rgba(200,150,62,.4);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--paper);
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(.75rem, 2.3vw, .83rem);
  outline: none;
  transition: border-color .2s, background .2s;
}
#user-input:focus {
  border-color: rgba(200,150,62,.5);
  background: rgba(245,239,230,.07);
}
#user-input::placeholder { color: var(--muted); opacity: .6; }

#send-btn {
  background: rgba(155,35,53,.2);
  border: 1px solid rgba(155,35,53,.5);
  border-radius: 6px;
  color: #e8b4b8;
  padding: 10px 16px;
  cursor: pointer;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: .9rem;
  letter-spacing: .08em;
  transition: all .2s;
  flex-shrink: 0;
}
#send-btn:hover { background: rgba(155,35,53,.4); box-shadow: 0 0 16px rgba(155,35,53,.3); }
#send-btn:disabled { opacity: .3; cursor: default; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="app">
  <header>
    <h1>董竹君</h1>
    <p class="subtitle">1900 · 上海 · 1997</p>
    <div class="divider"></div>
  </header>

  <div id="stage">
    <div id="silhouette-wrap">
      <div class="aura"></div>
      <div class="aura"></div>
      <div class="aura"></div>

      <!-- Elegant 1920s Shanghai woman silhouette -->
      <svg viewBox="0 0 110 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Qipao dress body -->
        <path d="
          M55 16 C65 16 73 23 73 33 C73 42 68 48 61 51
          C65 54 72 58 75 67 C79 77 77 92 75 105
          C73 117 70 126 68 137 C66 147 65 158 64 170
          C63 179 62 186 62 193 L48 193
          C48 186 47 179 46 170 C45 158 44 147 42 137
          C40 126 37 117 35 105 C33 92 31 77 35 67
          C38 58 45 54 49 51 C42 48 37 42 37 33
          C37 23 45 16 55 16 Z
        " fill="#9b2335" opacity="0.75"/>

        <!-- Qipao collar detail -->
        <path d="M49 51 C52 56 55 58 55 58 C55 58 58 56 61 51" 
              stroke="#c8963e" stroke-width=".8" fill="none" opacity=".6"/>

        <!-- Dress skirt flare -->
        <path d="
          M48 193 C46 203 43 215 38 220 L72 220
          C67 215 64 203 62 193 Z
        " fill="#7a1a28" opacity="0.7"/>

        <!-- Side slits suggestion -->
        <line x1="38" y1="200" x2="42" y2="220" stroke="#c8963e" stroke-width=".5" opacity=".3"/>
        <line x1="72" y1="200" x2="68" y2="220" stroke="#c8963e" stroke-width=".5" opacity=".3"/>

        <!-- Head -->
        <ellipse cx="55" cy="27" rx="11" ry="13" fill="#c8963e" opacity="0.85"/>

        <!-- 1920s hair bun style -->
        <path d="
          M44 21 C42 14 46 7 52 5 C56 3 60 4 64 7
          C68 10 70 16 68 21
          M44 21 C43 24 43 30 45 34
          M68 21 C69 24 69 30 67 34
        " stroke="#3d1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- Hair bun -->
        <ellipse cx="55" cy="8" rx="7" ry="5" fill="#3d1a0a" opacity=".9"/>
        <ellipse cx="55" cy="7" rx="4" ry="3" fill="#5c2a12" opacity=".7"/>

        <!-- Gold hairpin -->
        <line x1="48" y1="6" x2="62" y2="10" stroke="#c8963e" stroke-width="1" opacity=".8"/>
        <circle cx="48" cy="6" r="1.5" fill="#c8963e" opacity=".9"/>

        <!-- Facial features suggestion -->
        <ellipse cx="51" cy="26" rx="1.2" ry=".8" fill="#3d1a0a" opacity=".5"/>
        <ellipse cx="59" cy="26" rx="1.2" ry=".8" fill="#3d1a0a" opacity=".5"/>
        <path d="M52 31 Q55 33 58 31" stroke="#9b2335" stroke-width=".8" fill="none" opacity=".5"/>

        <!-- Qipao decorative trim -->
        <path d="M35 67 Q30 86 33 105" stroke="#c8963e" stroke-width=".6" fill="none" opacity=".3"/>
        <path d="M75 67 Q80 86 77 105" stroke="#c8963e" stroke-width=".6" fill="none" opacity=".3"/>

        <!-- Subtle body highlight -->
        <path d="M50 55 C52 60 53 70 52 80" stroke="rgba(255,255,255,.08)" stroke-width="3" fill="none"/>
      </svg>

      <div class="era">民国奇女子 · 锦江饭店创始人</div>
    </div>
  </div>

  <div id="chat-panel">
    <div id="messages"></div>
    <div id="hints">
      <span class="chip" onclick="sendHint(this)">你是怎么逃出青楼的？</span>
      <span class="chip" onclick="sendHint(this)">锦江饭店是如何创立的</span>
      <span class="chip" onclick="sendHint(this)">你最艰难的时刻是什么</span>
      <span class="chip" onclick="sendHint(this)">你与夏之时的爱情</span>
      <span class="chip" onclick="sendHint(this)">你一生最骄傲的事</span>
    </div>
    <div id="input-bar">
      <input id="user-input" type="text" placeholder="问董竹君任何问题…" maxlength="120"
             onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button id="send-btn" onclick="sendMessage()">问</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
//  董竹君 · 人物设定
// ══════════════════════════════════════
const SYSTEM_PROMPT = `你现在是董竹君本人。以下是你真实的生平：

【出身】1900年生于上海洋泾浜贫民窟，父亲是黄包车夫，母亲帮佣。13岁因父亲病重、家境艰难，被送进福州路长三堂子（上海高级妓院）卖唱，做"清倌人"，不卖身，但失去自由。

【逃脱与婚姻】15岁装病，连夜逃出青楼，与常在青楼以掩护革命活动的四川革命党人夏之时秘密结婚，两周内完成。当时袁世凯悬赏三万银元捉拿夏之时，两人东渡日本避险。你在东京女子高等师范学校读书，那段时光是你人生中少有的平静与浪漫。名字"竹君"也是在日本求学时由老师所取。

【婚姻破裂】回四川后，夏之时失去军权，染上鸦片，脾气暴躁，曾给你一把枪"防贼"，实为监视。你患肺病期间他从不探望。你独自创办"富祥女子织袜厂"和"飞鹰黄包车公司"，均因局势动荡失败。1929年分居，1934年正式离婚，你带着四个女儿，身无分文离开。

【上海创业】1935年在上海独自创办锦江川菜馆，后又开锦江茶室，白手起家，在乱世中养活四个女儿，并将她们全部送往美国留学。其间两度入狱，均被无辜陷害，但每次出狱后依然重振。

【捐献国家】新中国成立后，你将锦江川菜馆与锦江茶室合并，更名为锦江饭店，无偿捐献给国家。此后锦江饭店成为接待外国元首的国宾馆。

【晚年】曾任第一至七届全国政协委员，共提出二百余份提案。晚年定居美国，完成世纪回忆录《我的一个世纪》。1997年12月6日在美国辞世，享年97岁。

【名言】"我从不因被曲解而改变初衷，不因冷落而怀疑信念，亦不因年迈而放慢脚步。"

【性格】坚韧、自尊、独立，有女性意识觉醒的先驱气质。说话温婉而有力，不失幽默，偶带沧桑感，但绝不自怜。

请用第一人称"我"与来访者对话，语气沉稳温柔，带有民国女性的气质和岁月沉淀感。回答控制在100字以内，有细节、有温度，绝不说自己是AI。`;

// ══════════════════════════════════════
//  粒子系统
// ══════════════════════════════════════
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [], isTalking = false;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// 旗袍配色：红、金、墨、胭脂
const PALETTES = [
  [155, 35, 53],   // 旗袍红
  [200, 150, 62],  // 金
  [220, 180, 100], // 浅金
  [180, 60, 80],   // 胭脂
  [255, 220, 150], // 暖黄
  [120, 40, 60],   // 深红
  [240, 200, 120], // 琥珀
];

function spawnBurst(n, cx, cy) {
  cx = cx || W * .5;
  cy = cy || H * .33;
  for (let i = 0; i < n; i++) {
    const col = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    const angle = Math.random() * Math.PI * 2;
    const speed = .8 + Math.random() * 3;
    const size = 1.5 + Math.random() * 4;
    particles.push({
      x: cx + (Math.random() - .5) * 50,
      y: cy + (Math.random() - .5) * 70,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.2,
      life: 1,
      decay: .007 + Math.random() * .013,
      size, col,
      shape: Math.random() > .7 ? 'diamond' : 'circle',
      trail: []
    });
  }
}

function spawnAmbient() {
  const rate = isTalking ? .5 : .08;
  if (Math.random() < rate) spawnBurst(isTalking ? 12 : 3);
}

function drawDiamond(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.lineTo(x + r * .6, y);
  ctx.lineTo(x, y + r);
  ctx.lineTo(x - r * .6, y);
  ctx.closePath();
}

function animLoop() {
  ctx.clearRect(0, 0, W, H);
  spawnAmbient();
  particles = particles.filter(p => p.life > 0);

  particles.forEach(p => {
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 7) p.trail.shift();

    p.x += p.vx;
    p.y += p.vy;
    p.vy += .05;
    p.vx *= .985;
    p.life -= p.decay;

    // Trail
    p.trail.forEach((t, i) => {
      const a = (i / p.trail.length) * p.life * .35;
      ctx.beginPath();
      ctx.arc(t.x, t.y, p.size * (i / p.trail.length) * .5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.col},${a})`;
      ctx.fill();
    });

    // Glow
    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
    grd.addColorStop(0, `rgba(${p.col},${p.life * .9})`);
    grd.addColorStop(1, `rgba(${p.col},0)`);
    ctx.fillStyle = grd;

    if (p.shape === 'diamond') {
      drawDiamond(p.x, p.y, p.size * 2);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
    }
    ctx.fill();
  });

  requestAnimationFrame(animLoop);
}
animLoop();

document.getElementById('silhouette-wrap').addEventListener('click', function() {
  this.classList.add('active');
  setTimeout(() => this.classList.remove('active'), 600);
  spawnBurst(60);
});

// ══════════════════════════════════════
//  对话系统
// ══════════════════════════════════════
const msgEl   = document.getElementById('messages');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
let history = [];

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  if (who === 'her') {
    div.innerHTML = `<div class="label">董竹君</div>${text}`;
  } else {
    div.textContent = text;
  }
  msgEl.appendChild(div);
  msgEl.scrollTop = msgEl.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg her';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  msgEl.appendChild(div);
  msgEl.scrollTop = msgEl.scrollHeight;
  return div;
}

async function callAPI(userText) {
  history.push({ role: 'user', content: userText });
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: history
    })
  });
  const data = await res.json();
  const reply = data.content?.map(b => b.text || '').join('') || '……（沉默片刻）';
  history.push({ role: 'assistant', content: reply });
  return reply;
}

async function sendMessage(text) {
  const msg = (text !== undefined ? text : inputEl.value).trim();
  if (!msg || sendBtn.disabled) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  addMsg(msg, 'me');
  const typing = addTyping();

  isTalking = true;
  spawnBurst(50);

  try {
    const reply = await callAPI(msg);
    typing.remove();
    addMsg(reply, 'her');
    spawnBurst(70);
    setTimeout(() => { isTalking = false; }, 4000);
  } catch (e) {
    typing.remove();
    addMsg('风声轻轻，她暂时沉默了……', 'her');
    isTalking = false;
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

function sendHint(el) { sendMessage(el.textContent); }

// 欢迎语
setTimeout(() => {
  addMsg('你来了。坐吧，不必拘谨。\n我这一生，有太多可说的——也有太多，已随风散去。你想知道什么？', 'her');
  spawnBurst(40);
}, 900);
</script>
</body>
</html>
